name: Auto-Update Data

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 15 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install openpyxl

      - name: Daten von Google Sheets holen
        run: python3 scripts/update_data.py

      - name: FP/G im NBAFO-Scoring (Box Scores aus MFHFB HQ)
        continue-on-error: true
        run: python3 scripts/build_player_values.py

      - name: Fantrax (Tabelle, Wochen-Scores, Kader-Abgleich)
        continue-on-error: true
        run: python3 scripts/sync_fantrax.py

      - name: Änderungen committen (nur falls etwas geändert wurde)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/data.json data/player-values.json data/fantrax.json || [ -n "$(git status --porcelain data/)" ]; then
            git add data/data.json data/player-values.json data/fantrax.json
            git commit -m "Auto-Update draft-data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "Keine Änderungen an data/data.json — nichts zu committen."
          fi
